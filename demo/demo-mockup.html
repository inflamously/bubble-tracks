play: flex; align-items: baseline; gap: 7px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600\"><span style=\"font-size: 24px; color: #16262c\">S<\u002Fspan><span style=\"font-size: 22px; color: #1b6e84\">●<\u002Fspan><span style=\"font-size: 20px; color: #1b6e84\">◐<\u002Fspan><span style=\"font-size: 18px; color: #51646b\">○<\u002Fspan><span style=\"font-size: 16px; color: #ac3539\">?<\u002Fspan><span style=\"font-size: 14px; color: #16262c\">F<\u002Fspan><\u002Fspan><span aria-hidden=\"true\" style=\"display: flex; align-items: baseline; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.01em\"><span style=\"font-size: 26px\">B<\u002Fspan><span style=\"font-size: 25px\">u<\u002Fspan><span style=\"font-size: 24.5px\">b<\u002Fspan><span style=\"font-size: 24px\">b<\u002Fspan><span style=\"font-size: 23.5px\">l<\u002Fspan><span style=\"font-size: 23px\">e<\u002Fspan><span style=\"width: 7px\"><\u002Fspan><span style=\"font-size: 21.5px\">T<\u002Fspan><span style=\"font-size: 21px\">r<\u002Fspan><span style=\"font-size: 20.5px\">a<\u002Fspan><span style=\"font-size: 20px\">c<\u002Fspan><span style=\"font-size: 19.5px\">k<\u002Fspan><span style=\"font-size: 19px\">s<\u002Fspan><\u002Fspan><\u002Fa>\n<nav style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: center; font-weight: 500\">\n<a href=\"#how\" style=\"text-decoration: none; padding: 10px 0\">How it works<\u002Fa>\n<a href=\"#frame\" style=\"text-decoration: none; padding: 10px 0\">Guards and boundaries<\u002Fa>\n<a href=\"#install\" style=\"text-decoration: none; padding: 10px 0\">Install<\u002Fa>\n<a href=\"https://inflamously.github.io/bubble-tracks/\" style=\"text-decoration: none; padding: 10px 0\">Live demo<\u002Fa>\n<a href=\"https://github.com/inflamously/bubble-tracks\" style=\"text-decoration: none; padding: 10px 16px; border: 1.5px solid #16262c; border-radius: 999px\">GitHub<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<section style=\"max-width: 1120px; margin: 0 auto; padding: 56px 24px 72px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px; align-items: center\">\n<div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 22px\">\n<div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; color: #51646b\">A skill for Claude Code, Codex CLI and Gemini CLI<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(44px, 6.4vw, 84px); line-height: 0.98; letter-spacing: -0.02em\">Vibe coding, with a brake.<\u002Fh1>\n<p style=\"margin: 0; font-size: 20px; max-width: 34em; color: #33464d\">Your plan is one track of bubbles from Start to Finish. The agent works the bubbles it can see. When it reaches fog, it stops, and you decide what comes next.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; align-items: center\">\n<a href=\"https://inflamously.github.io/bubble-tracks/\" style=\"text-decoration: none; background: #1b6e84; color: #ffffff; padding: 14px 22px; border-radius: 999px; font-weight: 600\">Watch the real CLI run<\u002Fa>\n<a href=\"#install\" style=\"padding: 14px 6px; font-weight: 600\">Install it<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dk\" style=\"flex: 1 1 420px; min-width: 0; background: #12222a; color: #dcebee; border-radius: 18px; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; font-family: 'JetBrains Mono', ui-monospace, monospace\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-size: 13px; color: #8fa6ad\">\n<span>track: add-csv-export<\u002Fspan>\n<span>try it: press Step<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-size: 26px; font-weight: 600; letter-spacing: 0.12em; color: #dcebee\" role=\"img\" aria-label=\"Track progress from Start to Finish\">{{ glyphLine }}<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<sc-for list=\"{{ bubbles }}\" as=\"b\" hint-placeholder-count=\"5\">\n<div style=\"display: flex; gap: 14px; align-items: baseline; font-size: 15px; color: {{ b.color }}; font-weight: {{ b.weight }}\">\n<span aria-hidden=\"true\" style=\"width: 1em; text-align: center; flex: none\">{{ b.glyph }}<\u002Fspan>\n<span style=\"min-width: 0\">{{ b.label }}<\u002Fspan>\n<span style=\"margin-left: auto; font-size: 12px; flex: none; color: #8fa6ad\">{{ b.status }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"border-top: 1px solid #27404a; padding-top: 16px; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 15px; min-height: 48px; color: {{ msgColor }}\" aria-live=\"polite\">{{ message }}<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; font-family: 'Instrument Sans', system-ui, sans-serif\">\n<sc-if value=\"{{ showStep }}\" hint-placeholder-val=\"{{ true }}\">\n<button sc-camel-on-click=\"{{ step }}\" style=\"background: #71c1d6; color: #0f1a1e; border: 0; padding: 13px 22px; border-radius: 999px; font-weight: 600; min-height: 46px\">Step: let the agent work<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ showPlan }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ plan }}\" style=\"background: #e8a5ad; color: #3a0f12; border: 0; padding: 13px 22px; border-radius: 999px; font-weight: 600; min-height: 46px\">Plan the fog yourself<\u002Fbutton>\n<\u002Fsc-if>\n<button sc-camel-on-click=\"{{ restart }}\" style=\"background: transparent; color: #dcebee; border: 1.5px solid #8fa6ad; padding: 13px 22px; border-radius: 999px; font-weight: 600; min-height: 46px\">Restart<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" style=\"background: #e5f7eb; border-top: 1px solid #d3e6df; border-bottom: 1px solid #d3e6df\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.05; letter-spacing: -0.01em; max-width: 18em\">Most agent tools sell speed. This one gives you back the steering wheel.<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 32px\">\n<div style=\"flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 30px; color: #1b6e84\" aria-hidden=\"true\">●<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 600\">Small loops that close<\u002Fh3>\n<p style=\"margin: 0; color: #33464d\">A bubble is one task. It ends, you see it end, and the track shows how far you are from Finish.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 30px; font-weight: 600; color: #ac3539\" aria-hidden=\"true\">?<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 600\">Fog stops the agent<\u002Fh3>\n<p style=\"margin: 0; color: #33464d\">Unclear steps stay fog. The agent does not plan them on its own, and a hook blocks file edits while it stands on one.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 30px; color: #16262c\" aria-hidden=\"true\">◐<\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 600\">You steer after every bubble<\u002Fh3>\n<p style=\"margin: 0; color: #33464d\">The agent pauses when a bubble is done. Reorder, insert, remove, or turn a bubble back into fog before it moves on.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"frame\" style=\"max-width: 1120px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.05; letter-spacing: -0.01em; max-width: 16em\">A track has rules before it has code.<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start\">\n<div style=\"flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\"><div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; font-weight: 600; color: #1b6e84\">plan<\u002Fdiv><h3 style=\"margin: 0; font-size: 21px; font-weight: 600\">Plan mode, made easy<\u002Fh3><p style=\"margin: 0; color: #33464d\">Say the goal in chat. The agent drafts the whole track and shows it in one fixed shape, TL;DR first. Change anything and it shows the plan again. Nothing is created until you say go.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\"><div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; font-weight: 600; color: #1b6e84\">guard<\u002Fdiv><h3 style=\"margin: 0; font-size: 21px; font-weight: 600\">Guards put rules into the track<\u002Fh3><p style=\"margin: 0; color: #33464d\">A guard says what not to do or touch. The agent reads the guards before it acts, and a guard holds even when you later ask for something it rules out.<\u002Fp><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\"><div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; font-weight: 600; color: #1b6e84\">[Boundary: …]<\u002Fdiv><h3 style=\"margin: 0; font-size: 21px; font-weight: 600\">A boundary scopes every bubble<\u002Fh3><p style=\"margin: 0; color: #33464d\">Each bubble names the places it may touch: files, or whatever else the work is made of. The work stays small and easy to review.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0; background: #12222a; border-radius: 18px; padding: 26px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #8fa6ad\">example: the plan the agent proposes<\u002Fdiv>\n<div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; line-height: 1.7; display: flex; flex-direction: column; overflow-wrap: anywhere\"><div style=\"padding-left: 0px; color: #8fa6ad; font-weight: 400\">TL;DR<\u002Fdiv><div style=\"padding-left: 18px; color: #dcebee; font-weight: 400\">Add a CSV export to the orders page.<\u002Fdiv><div style=\"padding-left: 0px; color: #8fa6ad; font-weight: 400\">Goal<\u002Fdiv><div style=\"padding-left: 18px; color: #dcebee; font-weight: 400\">Users can download their orders as CSV.<\u002Fdiv><div style=\"padding-left: 0px; color: #8fa6ad; font-weight: 400\">Guards<\u002Fdiv><div style=\"padding-left: 18px; color: #dcebee; font-weight: 400\">1. Do not change the database schema.<\u002Fdiv><div style=\"padding-left: 18px; color: #dcebee; font-weight: 400\">2. Do not touch the PDF export.<\u002Fdiv><div style=\"padding-left: 0px; color: #8fa6ad; font-weight: 400\">Bubbles<\u002Fdiv><div style=\"padding-left: 18px; color: #dcebee; font-weight: 400\">1. Add the CSV endpoint<\u002Fdiv><div style=\"padding-left: 44px; color: #71c1d6; font-weight: 400\">[Boundary: api/export.ts]<\u002Fdiv><div style=\"padding-left: 18px; color: #dcebee; font-weight: 400\">2. Write the endpoint tests<\u002Fdiv><div style=\"padding-left: 44px; color: #71c1d6; font-weight: 400\">[Boundary: api/export.test.ts]<\u002Fdiv><div style=\"padding-left: 18px; color: #e8a5ad; font-weight: 600\">3. ? How do big exports get delivered?<\u002Fdiv><div style=\"padding-left: 44px; color: #e8a5ad; font-weight: 400\">why: nobody has decided yet<\u002Fdiv><div style=\"padding-left: 18px; color: #dcebee; font-weight: 400\">4. Wire the export button<\u002Fdiv><div style=\"padding-left: 44px; color: #71c1d6; font-weight: 400\">[Boundary: the orders page]<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width: 1120px; margin: 0 auto; padding: 0 24px 72px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px\">\n<div style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.05; letter-spacing: -0.01em\">Four kinds of fog<\u002Fh2>\n<p style=\"margin: 0; color: #33464d; max-width: 30em\">Not every unknown is the same. Naming the kind of fog tells you who should clear it, and how.<\u002Fp>\n<p style=\"margin: 0; color: #51646b; font-size: 15px; max-width: 30em\">The types are a convention you and the agent follow. No code enforces them.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 2 1 480px; min-width: 0; display: flex; flex-direction: column\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 18px 0; border-top: 1.5px solid #16262c\">\n<div style=\"flex: 0 0 190px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; font-size: 15px\">known-known<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; color: #33464d\">You know what to build and how. You write the plan for the bubble.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 18px 0; border-top: 1px solid #d3e6df\">\n<div style=\"flex: 0 0 190px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; font-size: 15px\">known-unknown<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; color: #33464d\">You know the question but not the answer. You and the agent work it out together.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 18px 0; border-top: 1px solid #d3e6df\">\n<div style=\"flex: 0 0 190px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; font-size: 15px\">unknown-known<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; color: #33464d\">The answer is in your head, but you have not said it yet. The agent helps you pull it out.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 18px 0; border-top: 1px solid #d3e6df; border-bottom: 1.5px solid #16262c\">\n<div style=\"flex: 0 0 190px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; font-size: 15px\">unknown-unknown<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; color: #33464d\">Too much is open to plan at all. The agent interviews you first.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"dk\" style=\"background: #12222a; color: #dcebee\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 36px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.05; letter-spacing: -0.01em; max-width: 16em\">One track is the start. Bigger work gets more of them.<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px 32px\">\n<div style=\"flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; color: #e8a5ad\">bubble fork<\u002Fdiv>\n<p style=\"margin: 0; color: #dcebee\">Split a bubble into its own child track. The parent waits until the child is done.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; color: #e8a5ad\">bubble diverge<\u002Fdiv>\n<p style=\"margin: 0; color: #dcebee\">Open a side track for the idea that showed up mid-task, without derailing the main one.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; color: #e8a5ad\">bubble research<\u002Fdiv>\n<p style=\"margin: 0; color: #dcebee\">Gather sources for one bubble before anyone writes code for it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 600; color: #e8a5ad\">bubble abilities<\u002Fdiv>\n<p style=\"margin: 0; color: #dcebee\">Reusable workflows, kept as Markdown files, that run against a bubble or a whole track.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 0; color: #8fa6ad; font-size: 15px; max-width: 44em\">Tracks are plain JSON in <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace\">.bubble-tracks/<\u002Fspan>, so they live in your repo and show up in your diffs. A closed track is read-only.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"install\" style=\"max-width: 1120px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px\">\n<div style=\"flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.05; letter-spacing: -0.01em\">Install<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-weight: 600\">Claude Code<\u002Fdiv>\n<div style=\"overflow-x: auto; background: #12222a; color: #dcebee; border-radius: 12px; padding: 16px 18px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; white-space: nowrap\">/plugin marketplace add inflamously/bubble-coding<\u002Fdiv>\n<div style=\"color: #51646b; font-size: 15px\">Then add the status line by hand. Plugins cannot set it for you.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-weight: 600\">Codex CLI, Gemini CLI, or any agent that reads AGENTS.md<\u002Fdiv>\n<div style=\"overflow-x: auto; background: #12222a; color: #dcebee; border-radius: 12px; padding: 16px 18px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; white-space: nowrap\">node install.js [YOUR TARGET]<\u002Fdiv>\n<div style=\"color: #51646b; font-size: 15px\">Run it from a checkout. The installer backs up every file it changes to *.bak.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"color: #51646b; font-size: 15px\">Needs Node.js [VERSION]. No npm runtime dependencies. MIT licensed.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px; background: #ffffff; border: 1px solid #b5d0cb; border-radius: 18px; padding: 28px; box-sizing: border-box; align-self: flex-start\">\n<h3 style=\"margin: 0; font-size: 21px; font-weight: 600\">Honest limits<\u002Fh3>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; color: #33464d\">\n<li>The fog gate blocks file-edit tools. It does not block shell writes.<\u002Fli>\n<li>With AGENTS.md alone the gate is soft: the model is told to stop, nothing forces it.<\u002Fli>\n<li>The live status line works in Claude Code. Codex and Gemini use <span style=\"font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px\">bubble show<\u002Fspan>.<\u002Fli>\n<li>Hook paths are absolute. Teammates re-run the installer after cloning.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top: 1px solid #d3e6df\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 28px 24px 40px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 16px 28px; justify-content: space-between; align-items: center; color: #51646b; font-size: 15px\">\n<div>Bubble Tracks. Built by one developer who got tired of headaches from pure vibe coding.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<a href=\"https://github.com/inflamously/bubble-tracks\" style=\"padding: 10px 0\">GitHub<\u002Fa>\n<a href=\"https://inflamously.github.io/bubble-tracks/\" style=\"padding: 10px 0\">Live demo<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:3330}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { pos: 1, planned: false };\n  }\n  renderVals() {\n    var pos = this.state.pos;\n    var planned = this.state.planned;\n    var FOG = 3;\n    var labels = [\n      'Read the export code',\n      'Add the CSV endpoint',\n      'Write the endpoint tests',\n      planned ? 'Stream big exports in chunks' : 'How do big exports get delivered?',\n      'Wire the export button'\n    ];\n    var stopped = pos === FOG && !planned;\n    var finished = pos >= labels.length;\n    var glyphs = [];\n    var bubbles = labels.map(function (label, i) {\n      var kind = 'todo';\n      if (i === FOG && !planned) kind = 'fog';\n      else if (i < pos) kind = 'done';\n      else if (i === pos) kind = 'active';\n      var look = {\n        done: { glyph: '●', color: '#71c1d6', weight: 400, status: 'done' },\n        active: { glyph: '◐', color: '#FFFFFF', weight: 600, status: 'active' },\n        todo: { glyph: '○', color: '#8fa6ad', weight: 400, status: 'todo' },\n        fog: { glyph: '?', color: '#e8a5ad', weight: 600, status: 'fog' }\n      }[kind];\n      glyphs.push(look.glyph);\n      return { label: label, glyph: look.glyph, color: look.color, weight: look.weight, status: look.status };\n    });\n    var message = 'The agent is working on: ' + (labels[pos] || '') + '.';\n    if (stopped) message = 'Stopped at fog. The agent cannot edit files here until you plan this bubble.';\n    if (finished) message = 'Finish reached. Every step on this track was one you saw first.';\n    var self = this;\n    return {\n      bubbles: bubbles,\n      glyphLine: 'S ' + glyphs.join(' ') + ' F',\n      message: message,\n      msgColor: stopped ? '#e8a5ad' : '#dcebee',\n      showStep: !stopped && !finished,\n      showPlan: stopped,\n      step: function () { self.setState({ pos: Math.min(self.state.pos + 1, 5) }); },\n      plan: function () { self.setState({ planned: true }); },\n      restart: function () { self.setState({ pos: 1, planned: false }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
